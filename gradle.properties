#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Project
# The base package of every module: the convention plugins derive Android namespaces from it
# (:core:common -> <base>.core.common). scripts/rename.sh changes it together with the sources.
app.basePackage=com.yet.template
